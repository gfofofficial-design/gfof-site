name: Treasury revenue reporting
on:
  pull_request:
    paths: ['treasury.html', 'assets/federation/treasury-revenue-*.mjs', 'tests/treasury-revenue.test.mjs', 'tests/treasury-revenue-publication.test.mjs', 'tools/treasury-review/check-publication.mjs', 'record/**', '.github/workflows/treasury-revenue.yml']
  push:
    branches: [main]
    paths: ['treasury.html', 'assets/federation/treasury-revenue-*.mjs', 'tests/treasury-revenue.test.mjs', 'tests/treasury-revenue-publication.test.mjs', 'tools/treasury-review/check-publication.mjs', 'record/**', '.github/workflows/treasury-revenue.yml']
permissions:
  contents: read
jobs:
  revenue-report:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - run: node --check assets/federation/treasury-revenue-page.mjs
      - run: node --test tests/treasury-revenue-publication.test.mjs tests/treasury-revenue.test.mjs tests/static-publish.test.mjs
      - run: node scripts/build-static-publish.mjs
      - run: node tools/treasury-review/check-publication.mjs
