name: Alliance server connection candidate
on:
  pull_request:
    paths:
      - 'lib/alliance-avatar-server/**'
      - 'lib/alliance-avatar-storage.mjs'
      - 'lib/alliance-avatar-runtime/limits.mjs'
      - 'assets/federation/fed-alliance-profile-contract.mjs'
      - 'assets/federation/fed-alliance-profile-revision-contract.mjs'
      - 'assets/federation/fed-alliance-collaboration-contract.mjs'
      - 'assets/federation/fed-alliance-community-core.mjs'
      - 'assets/federation/fed-alliance-feedback-contract.mjs'
      - 'assets/federation/fed-alliance-report-review-contract.mjs'
      - 'assets/federation/fed-alliance-report-review-panel.mjs'
      - 'sql/alliance-report-review-candidate.sql'
      - 'tests/alliance-report-review.test.mjs'
      - 'tests/alliance-report-review-panel.test.mjs'
      - 'sql/alliance-feedback-candidate.sql'
      - 'lib/alliance-feedback-http.mjs'
      - 'tests/alliance-feedback-http.test.mjs'
      - 'sql/alliance-community-candidate.sql'
      - 'sql/alliance-avatar-ledger-candidate.sql'
      - 'sql/alliance-avatar-session-candidate.sql'
      - 'sql/alliance-avatar-removal-candidate.sql'
      - 'sql/alliance-avatar-cleanup-candidate.sql'
      - 'sql/alliance-avatar-recovery-candidate.sql'
      - 'sql/alliance-avatar-restore-review-candidate.sql'
      - 'sql/alliance-deletion-journal-store-candidate.sql'
      - 'sql/alliance-journal-admission-candidate.sql'
      - 'sql/alliance-creation-admission-candidate.sql'
      - 'sql/alliance-profile-write-fence-candidate.sql'
      - 'sql/alliance-profile-revision-candidate.sql'
      - 'sql/alliance-profile-directory-candidate.sql'
      - 'sql/alliance-member-recovery-inventory-candidate.sql'
      - 'sql/alliance-journal-recovery-inventory-candidate.sql'
      - 'sql/alliance-control-store-candidate.sql'
      - 'sql/alliance-control-removal-anchor-candidate.sql'
      - 'sql/alliance-member-anchored-removal-candidate.sql'
      - 'sql/alliance-profile-bound-removal-candidate.sql'
      - 'sql/alliance-auth-deletion-guard-candidate.sql'
      - 'sql/alliance-account-protocol-candidate.sql'
      - 'sql/alliance-account-history-store-candidate.sql'
      - 'sql/alliance-account-ack-store-candidate.sql'
      - 'sql/alliance-profile-candidate.sql'
      - 'tests/alliance-profile-native*'
      - 'tests/alliance-account-dynamodb-native.py'
      - '.github/workflows/alliance-avatar-server.yml'
permissions:
  contents: read
jobs:
  ledger-driver:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      # Installation must not wait on npm's implicit, duplicate advisory call.
      # The explicit mandatory audit below still blocks acceptance on failure.
      - run: npm ci --prefix lib/alliance-avatar-server --ignore-scripts --no-fund --no-audit
      - run: npm test --prefix lib/alliance-avatar-server
      - run: node --test tests/alliance-feedback-http.test.mjs
      - run: node lib/alliance-avatar-server/recovery-package.native.mjs --download-age
        env:
          ALLIANCE_RECOVERY_PACKAGE_TEST_CONFIRM: synthetic_encrypted_package
      - name: Mandatory dependency security audit
        timeout-minutes: 1
        run: npm audit --prefix lib/alliance-avatar-server --audit-level=high --fetch-timeout=10000 --fetch-retries=0
  ledger-tls-native:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: alliance_disposable_server_fixture_only
        ports:
          - '127.0.0.1:54329:5432'
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - run: npm ci --prefix lib/alliance-avatar-server --ignore-scripts --no-fund --no-audit
      - run: node lib/alliance-avatar-server/native.mjs
        env:
          ALLIANCE_AVATAR_SERVER_TEST_CONFIRM: disposable_server_fixture
          ALLIANCE_RECOVERY_PACKAGE_TEST_CONFIRM: synthetic_encrypted_package
          ALLIANCE_AVATAR_SERVER_TEST_CONTAINER: ${{ job.services.postgres.id }}
          ALLIANCE_ENCRYPTED_ARCHIVE_SOURCE_COMMIT: ${{ github.sha }}
  authority-dynamodb-native:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - run: npm ci --prefix lib/alliance-avatar-server --ignore-scripts --no-fund --no-audit
      - name: Actual isolated local DynamoDB protocol
        run: sudo env ALLIANCE_DYNAMO_TEST_CONFIRM=synthetic_account_dynamodb ALLIANCE_NODE_BINARY="$(command -v node)" python3 -I tests/alliance-account-dynamodb-native.py

