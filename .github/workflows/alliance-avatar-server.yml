name: Alliance server connection candidate
on:
  pull_request:
    paths:
      - 'lib/alliance-avatar-server/**'
      - 'lib/alliance-avatar-storage.mjs'
      - 'lib/alliance-avatar-runtime/limits.mjs'
      - 'sql/alliance-avatar-ledger-candidate.sql'
      - 'sql/alliance-avatar-session-candidate.sql'
      - 'sql/alliance-avatar-cleanup-candidate.sql'
      - 'sql/alliance-avatar-recovery-candidate.sql'
      - 'sql/alliance-avatar-restore-review-candidate.sql'
      - 'sql/alliance-deletion-journal-store-candidate.sql'
      - 'sql/alliance-profile-candidate.sql'
      - 'tests/alliance-profile-native*'
      - '.github/workflows/alliance-avatar-server.yml'
permissions:
  contents: read
jobs:
  ledger-driver:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --prefix lib/alliance-avatar-server --ignore-scripts --no-fund
      - run: npm audit --prefix lib/alliance-avatar-server --audit-level=high
      - run: npm test --prefix lib/alliance-avatar-server
  ledger-tls-native:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: alliance_disposable_server_fixture_only
        ports:
          - '127.0.0.1:54329:5432'
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --prefix lib/alliance-avatar-server --ignore-scripts --no-fund
      - run: node lib/alliance-avatar-server/native.mjs
        env:
          ALLIANCE_AVATAR_SERVER_TEST_CONFIRM: disposable_server_fixture
          ALLIANCE_AVATAR_SERVER_TEST_CONTAINER: ${{ job.services.postgres.id }}
