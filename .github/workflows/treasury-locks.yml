name: Treasury lock reader
on:
  pull_request:
    paths: ['treasury.html', 'netlify/functions/treasury-locks.mjs', 'tests/treasury-locks.test.mjs', 'record/current-mint-locks-three-20261008.json', '.github/workflows/treasury-locks.yml']
  push:
    branches: [main]
    paths: ['treasury.html', 'netlify/functions/treasury-locks.mjs', 'tests/treasury-locks.test.mjs', 'record/current-mint-locks-three-20261008.json', '.github/workflows/treasury-locks.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/treasury-locks.test.mjs
