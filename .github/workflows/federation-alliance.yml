name: Federation Alliance checks
on:
  pull_request:
    paths:
      - 'alliance*.html'
      - 'assets/federation/fed-alliance*'
      - 'assets/federation/fed-community-league*'
      - 'netlify/lib/community-league.cjs'
      - 'command-deck-privacy.html'
      - 'tests/federation-community-league.test.mjs'
      - 'command-deck.html'
      - 'assets/federation/fed-deck.css'
      - 'netlify.toml'
      - 'tests/federation-alliance.test.mjs'
      - 'tests/federation-alliance-launchpad.test.mjs'
      - 'tests/federation-alliance-community.test.mjs'
      - 'tests/federation-alliance-challenges.test.mjs'
      - 'tests/federation-alliance-member-form.test.mjs'
      - '.github/workflows/federation-alliance.yml'
  push:
    branches: [main]
    paths:
      - 'alliance*.html'
      - 'assets/federation/fed-alliance*'
      - 'assets/federation/fed-community-league*'
      - 'netlify/lib/community-league.cjs'
      - 'command-deck-privacy.html'
      - 'tests/federation-community-league.test.mjs'
      - 'command-deck.html'
      - 'assets/federation/fed-deck.css'
      - 'netlify.toml'
      - 'tests/federation-alliance.test.mjs'
      - 'tests/federation-alliance-launchpad.test.mjs'
      - 'tests/federation-alliance-community.test.mjs'
      - 'tests/federation-alliance-challenges.test.mjs'
      - 'tests/federation-alliance-member-form.test.mjs'
      - '.github/workflows/federation-alliance.yml'
permissions:
  contents: read
jobs:
  stations:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: node --check assets/federation/fed-alliance-registry.mjs
      - run: node --check assets/federation/fed-alliance.mjs
      - run: node --check assets/federation/fed-alliance-launchpad-core.mjs
      - run: node --check assets/federation/fed-alliance-launchpad.mjs
      - run: node --check assets/federation/fed-community-league.mjs
      - run: node --check netlify/lib/community-league.cjs
      - run: node --test tests/federation-alliance-member-form.test.mjs tests/federation-alliance-community.test.mjs tests/federation-alliance-challenges.test.mjs tests/federation-alliance.test.mjs tests/federation-community-league.test.mjs tests/federation-alliance-launchpad.test.mjs
