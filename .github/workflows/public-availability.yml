name: Public availability checker tests
on:
  pull_request:
    paths:
      - 'config/public-availability.json'
      - 'scripts/check-public-availability.mjs'
      - 'tests/public-availability.test.mjs'
      - '.github/workflows/public-availability.yml'
  push:
    branches: [main]
    paths:
      - 'config/public-availability.json'
      - 'scripts/check-public-availability.mjs'
      - 'tests/public-availability.test.mjs'
      - '.github/workflows/public-availability.yml'
permissions:
  contents: read
jobs:
  fixture-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Check syntax
        run: node --check scripts/check-public-availability.mjs
      - name: Run isolated monitoring fixtures
        run: node --test tests/public-availability.test.mjs
