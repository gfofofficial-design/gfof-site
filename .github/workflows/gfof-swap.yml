name: GFOF swap quote preview
on:
  pull_request:
    paths: ['swap.html', 'assets/federation/swap/**', 'tests/gfof-swap*.mjs', '.github/workflows/gfof-swap.yml']
  push:
    branches: [main]
    paths: ['swap.html', 'assets/federation/swap/**', 'tests/gfof-swap*.mjs', '.github/workflows/gfof-swap.yml']
permissions:
  contents: read
jobs:
  swap-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - run: node --check assets/federation/swap/quote-core.mjs
      - run: node --check assets/federation/swap/swap-page.mjs
      - run: node --test tests/gfof-swap.test.mjs tests/gfof-swap-page.test.mjs tests/static-publish.test.mjs
      - run: node scripts/build-static-publish.mjs
