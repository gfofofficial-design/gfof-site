name: Galactic Swap managed pilot
on:
  pull_request:
    paths: ['tools/swap-pilot/**', 'tests/gfof-swap-managed-pilot.test.mjs', 'netlify.toml', '.github/workflows/galactic-swap-managed-pilot.yml']
permissions:
  contents: read
jobs:
  managed-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - run: node --test tests/gfof-swap-managed-pilot.test.mjs
      - run: node tools/swap-pilot/build.mjs
        env:
          CONTEXT: deploy-preview
